[project]
name = "osprebit"
version = "0.1.0-dev"
description = "Lightweight self-hosted Git web interface based on Litestar + Jinja2 + pygit2"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Hao Wu", email = "hao.wu@ortzikantu.com" }]
maintainers = [{ name = "Hao Wu", email = "hao.wu@ortzikantu.com" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Litestar",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Version Control :: Git",
]
keywords = ["git", "web-interface", "self-hosted", "cgit", "litestar", "pygit2"]

dependencies = [
    "litestar>=2.19.0",
    "jinja2>=3.1.0",
    "pygit2>=1.19.0",
    "uvicorn[standard]>=0.40.0",
    "python-dotenv>=1.2.1",
    "Pygments>=2.19.2",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "Faker>=40.1.2",
    "polyfactory>=3.2.0",
    "rich>=14.3.1",
    "EditorConfig>=0.17.1",
]

[project.urls]
Homepage = "https://codeberg.org/ortzikantu/osprebit"
Repository = "https://codeberg.org/ortzikantu/osprebit"
Issues = "https://codeberg.org/ortzikantu/osprebit/issues"

[project.scripts]
osprebit = "osprebit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osprebit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
]
ignore = [
    "E501",
    "N802",
    "N803",
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = ["osprebit"]
